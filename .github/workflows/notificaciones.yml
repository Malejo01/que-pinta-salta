# Notificaciones push (R39): llama GET /api/cron/notificaciones, que arma la tanda de recordatorios y
# novedades y la manda por la API HTTP de Expo Push.
#
# PRENDIDO EN Q5-14 (pedido de Mauro, 3/11: «el envío real»):
#   - `schedule` cada hora al minuto 5. GitHub solo corre los `schedule` de la rama por defecto: recién
#     arranca cuando la integración llegue a `main`.
#   - La ruta sigue en dryRun por defecto: arma la tanda y la registra, pero no manda nada mientras la
#     variable PUSH_ENVIO_REAL no sea "1" en Vercel (la pone Mauro; el agente no toca variables).
#   - Cada corrida respeta las horas de silencio y el tope diario de cada persona (`armarTanda`,
#     @qps/core/notificaciones/tanda: `estaEnHorarioDeSilencio` y `hayLugarEnTopeDiario`), y los avisos
#     sin cuenta excluyen igual por silencio y tope (@qps/core/notificaciones/equipo).
#   - `workflow_dispatch` sigue para correrlo a mano.
# Lo creó el lead de día, porque el perfil de noche no puede escribir en .github/.
name: Notificaciones push

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: notificaciones
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://www.quepintasalta.com.ar' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Armar y mandar la tanda (dryRun salvo PUSH_ENVIO_REAL=1 en el servidor)
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then echo "::error::Falta el secret CRON_SECRET"; exit 1; fi
          body=$(curl -sS --fail-with-body --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-job-trigger: github-actions" \
            "$SITE_URL/api/cron/notificaciones")
          echo "$body" | jq .
