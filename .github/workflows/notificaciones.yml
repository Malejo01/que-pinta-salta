# Notificaciones push (R39): llama GET /api/cron/notificaciones, que arma la tanda de recordatorios y
# novedades y la manda por la API HTTP de Expo Push.
#
# APAGADO A PROPÓSITO (encargo de Mauro, 16/10):
#   - Sin `schedule`: solo corre a mano (`workflow_dispatch`). Para encenderlo cada hora, descomentar el
#     bloque `schedule` de abajo. Eso lo hace Mauro cuando la app tenga push (expo-notifications).
#   - Además, la ruta está en modo dryRun por defecto: arma la tanda y la registra, pero no manda nada
#     mientras la variable de entorno PUSH_ENVIO_REAL no sea "1" en Vercel.
# Lo creó el lead de día, porque el perfil de noche no puede escribir en .github/.
name: Notificaciones push

on:
  # schedule:
  #   - cron: "5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: notificaciones
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://www.quepintasalta.com.ar' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Armar y mandar la tanda (dryRun salvo PUSH_ENVIO_REAL=1 en el servidor)
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then echo "::error::Falta el secret CRON_SECRET"; exit 1; fi
          body=$(curl -sS --fail-with-body --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-job-trigger: github-actions" \
            "$SITE_URL/api/cron/notificaciones")
          echo "$body" | jq .
