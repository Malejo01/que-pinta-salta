# Eventos en inglés (Q4-7): cada día a las 07:10 de Salta (10:10 UTC) llama
# GET /api/cron/traducir-eventos, que traduce un lote de 10 títulos y
# descripciones de eventos próximos con el cliente de IA del pipeline
# (GEMINI_MODEL). Repite mientras queden eventos y no se llegue al tope diario
# (TRADUCCION_TOPE_DIARIO en Vercel, por defecto 100; con 0 no traduce nada),
# como mucho 10 llamadas. El tope lo cuenta la base: correrlo a mano el mismo
# día no lo pasa. Falla (y GitHub manda mail) si una llamada da error HTTP
# (Q6-10: 503 cuando la IA corta la corrida: sin crédito, clave, límite…).
name: Eventos en inglés (traducción diaria)

on:
  schedule:
    - cron: "10 10 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: traducir-eventos
  cancel-in-progress: false

jobs:
  traducir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://www.quepintasalta.com.ar' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Traducir en lotes hasta el tope del día
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then echo "::error::Falta el secret CRON_SECRET"; exit 1; fi
          # El Bearer solo va a los hosts propios: SITE_URL viene de una variable editable.
          case "$SITE_URL" in
            https://www.quepintasalta.com.ar|https://quepintasalta.com.ar) ;;
            *) echo "::error::SITE_URL no permitido"; exit 1 ;;
          esac
          for i in $(seq 1 10); do
            # Q6-10: con 503 (la IA cortó la corrida: sin crédito, clave, límite…) se muestra el motivo y falla.
            if ! body=$(curl -sS --fail-with-body --max-time 120 \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "x-job-trigger: github-actions" \
              "$SITE_URL/api/cron/traducir-eventos"); then
              echo "$body" | jq '{status, errorProveedor, intentados, traducidos, descartados}' 2>/dev/null || true
              echo "::error::La traducción falló: mirá errorProveedor arriba y job_runs (traduccion)"
              exit 1
            fi
            echo "$body" | jq '{status, tope, traducidosHoyAntes, intentados, traducidos, descartados, descartesPorMotivo, errorProveedor, errores, quedan}'
            quedan=$(echo "$body" | jq -r '.quedan')
            if [ "$quedan" != "true" ]; then break; fi
          done
