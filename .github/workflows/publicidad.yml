# Publicidad: cada día a las 06:00 de Salta (09:00 UTC) llama GET
# /api/cron/publicidad. Hace cuatro cosas independientes: registra la ocupación
# del Hero y del push del día, propone el ciclo de precios del mes (si todavía
# no existe), mide las bajas del push patrocinado a las 48 h y genera los
# reportes de las campañas que terminaron. Falla (y GitHub manda mail) si la
# llamada da error HTTP o si el status de la corrida es FAILED.
#
# Correrlo a mano es seguro: es idempotente (la ocupación se escribe por día, el
# ciclo solo si falta el del mes, las bajas una vez por campaña y un reporte por
# campaña).
name: Publicidad (precios, ocupación y reportes)

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: publicidad
  cancel-in-progress: false

jobs:
  publicidad:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://www.quepintasalta.com.ar' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Correr el cron de publicidad
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then echo "::error::Falta el secret CRON_SECRET"; exit 1; fi
          # El Bearer solo va a los hosts propios: SITE_URL viene de una variable editable.
          case "$SITE_URL" in
            https://www.quepintasalta.com.ar|https://quepintasalta.com.ar) ;;
            *) echo "::error::SITE_URL no permitido"; exit 1 ;;
          esac
          body=$(curl -sS --fail-with-body --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-job-trigger: github-actions" \
            "$SITE_URL/api/cron/publicidad")
          echo "$body" | jq .
          status=$(echo "$body" | jq -r '.status')
          if [ "$status" = "FAILED" ]; then echo "::error::La corrida de publicidad terminó FAILED"; exit 1; fi
