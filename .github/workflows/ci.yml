# CI: typecheck, lint, tests, build y esquema de la base.
#
# Monorepo (R22): npm workspaces y Turborepo. npm ci corre en la raíz; el
# typecheck pasa por turbo (apps/web y packages/*); supabase/ sigue en la raíz.
#
# next.config.mjs dejaba pasar errores de tipos en el build, así que ningún
# deploy fallaba por tipos; esto lo controla en cada push y PR.
#
# No usa credenciales de producción: la base es una Postgres efímera del runner
# (supabase db start) armada solo con supabase/migrations/.
name: CI

on:
  push:
  pull_request:

# Solo hace checkout: no necesita escribir nada en el repo.
permissions:
  contents: read

# Turborepo no manda telemetría desde el CI.
env:
  TURBO_TELEMETRY_DISABLED: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # Ahorro de builds (ronda/ahorro-vercel): Vercel ya no construye cada push de
  # rama (solo con [preview] en el commit), así que lint, tests y build se
  # verifican acá. GitHub Actions es gratis en repo público; Vercel cobra el
  # Build CPU.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit:
    name: Tests unitarios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Casos del Ignored Build Step de Vercel (scripts/vercel-ignore.sh)
      - run: bash scripts/vercel-ignore.test.sh

  build:
    name: Build de la web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Valores de prueba: el build no se conecta a nada y no usa secretos de producción
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-de-prueba
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SUPABASE_SERVICE_ROLE_KEY: ci-service-key-de-prueba
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  database:
    name: Migraciones y tipos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # El CLI de Supabase es devDependency: misma versión que en local.
      - run: npm ci

      # Levanta Postgres vacío y aplica supabase/migrations/ en orden. Si alguna
      # migración falla, el comando falla y el job también.
      - name: Aplicar todas las migraciones sobre una base vacía
        run: npx supabase db start

      # Tests de base (pgTAP, supabase/tests/): corren sobre la base efímera,
      # cada archivo en una transacción con rollback. Sin credenciales.
      - name: Tests de la base (pgTAP)
        run: npx supabase test db

      - name: Verificar lo que el baseline crea fuera de public
        run: |
          set -euo pipefail
          out=$(docker exec supabase_db_que-pinta-salta psql -U postgres -At -c "
            select (select count(*) from pg_policies where schemaname = 'storage')
              || ' ' || (select count(*) from pg_trigger where tgrelid = 'auth.users'::regclass and tgname = 'on_auth_user_created')
              || ' ' || (select count(*) from storage.buckets where id in ('flyers', 'flyers_ig'))")
          echo "políticas de storage, trigger de auth.users, buckets: $out"
          read -r pols trg buckets <<< "$out"
          if [ "$pols" -lt 1 ] || [ "$trg" -ne 1 ] || [ "$buckets" -ne 2 ]; then
            echo "::error::Falta algo del baseline fuera de public"; exit 1
          fi

      # Los tipos commiteados tienen que ser los que salen de las migraciones.
      - name: Regenerar tipos y comparar con packages/db/src/database.types.ts
        run: |
          set -euo pipefail
          npx supabase gen types typescript --local --schema public > "$RUNNER_TEMP/database.types.ts"
          if ! diff -u packages/db/src/database.types.ts "$RUNNER_TEMP/database.types.ts"; then
            echo "::error::packages/db/src/database.types.ts no coincide con las migraciones. Corré 'npm run db:types' y commitealo."
            exit 1
          fi
